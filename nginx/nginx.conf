# Nginx 설정 파일 - T3.small 최적화 버전
# 메모리 효율적인 설정으로 구성

user nginx;
worker_processes auto;  # CPU 코어 수에 맞게 자동 설정
worker_rlimit_nofile 1024;  # 파일 디스크립터 제한 (메모리 절약)

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;  # 동시 연결 수 제한 (메모리 절약)
    use epoll;  # 효율적인 이벤트 모델
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 로그 형식 (간소화)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 성능 최적화 설정
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;  # 보안: Nginx 버전 숨김

    # Gzip 압축 (메모리 절약을 위해 최소 설정)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_min_length 1000;
    gzip_disable "msie6";

    # 버퍼 크기 최적화 (메모리 절약)
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 2 4k;

    # 타임아웃 설정
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # 캐시 설정 (메모리 절약)
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # 추가 설정 파일 포함
    include /etc/nginx/conf.d/*.conf;
}

